name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      # 如果仓库没有gradlew，直接下载gradle wrapper脚本文件，而不是apt安装gradle
      - name: Download Gradle Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            curl -s https://raw.githubusercontent.com/gradle/gradle/master/subprojects/base-services/src/main/resources/gradle-wrapper.sh -o gradlew
            mkdir -p gradle/wrapper
            curl -s https://raw.githubusercontent.com/gradle/gradle/master/subprojects/base-services/src/main/resources/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-4.4.1-bin.zip' > gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
