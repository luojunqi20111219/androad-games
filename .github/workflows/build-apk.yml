name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK (cmdline-tools 5.0 JDK8 compatible)
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-6609375_latest.zip
          unzip commandlinetools-linux-6609375_latest.zip
          # 重点：解压出来是 tools，重命名为 latest
          mv tools latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_ENV
          yes | sdkmanager --licenses
          sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-28" "build-tools;28.0.3"

      - name: Prepare Gradle Wrapper 4.4.1
        run: |
          if [ ! -f gradlew ]; then
            curl -s https://raw.githubusercontent.com/gradle/gradle/v4.4.1/subprojects/base-services/src/main/resources/gradle-wrapper.sh -o gradlew
            mkdir -p gradle/wrapper
            curl -s https://raw.githubusercontent.com/gradle/gradle/v4.4.1/subprojects/base-services/src/main/resources/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-4.4.1-bin.zip' > gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
