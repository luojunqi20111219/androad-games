name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 安装JDK17：用来跑新版sdkmanager安装Android SDK
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      # 2. 切换到JDK8：用来编译老项目 Gradle4.4.1
      - name: Setup JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      # 准备gradle wrapper，固定4.4.1
      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            curl -s https://raw.githubusercontent.com/gradle/gradle/v4.4.1/subprojects/base-services/src/main/resources/gradle-wrapper.sh -o gradlew
            mkdir -p gradle/wrapper
            curl -s https://raw.githubusercontent.com/gradle/gradle/v4.4.1/subprojects/base-services/src/main/resources/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-4.4.1-bin.zip' > gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
